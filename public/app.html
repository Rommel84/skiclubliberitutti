<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Liberi Tutti – Registro Allenamenti</title>
<style>
:root{--bg:#eef2ec;--card:#fff;--tx:#101612;--mu:#5d6b61;--ac:#1e6b43;--onac:#fff;--ac2:#dce8d9;--ok:#2f8f5b;--bd:#d3ddd0;--pr:#e8751a;--prbg:#fde8d6;--dg:#c2410c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media not all{:root:not([data-theme="light"]){--bg:#0a0d0b;--card:#141a16;--tx:#e8eee8;--mu:#9bab9f;--ac:#6fc48f;--onac:#0a0d0b;--ac2:#1d2b22;--ok:#6fc48f;--bd:#26322a;--prbg:#3a2412}}
:root[data-theme="dark"]{--bg:#0a0d0b;--card:#141a16;--tx:#e8eee8;--mu:#9bab9f;--ac:#6fc48f;--onac:#0a0d0b;--ac2:#1d2b22;--ok:#6fc48f;--bd:#26322a;--prbg:#3a2412}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:90px}
header{padding:14px 16px 12px;background:#0a0d0b;color:#e8eee8;border-bottom:3px solid #2f8f5b}
h1{font-size:19px;margin:0}header small{color:#a9c4af}
nav{display:flex;gap:6px;padding:8px 12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:15px}
nav button.on{background:var(--ac);color:var(--onac);border-color:var(--ac)}
main{padding:4px 12px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:8px 0}
.row{display:flex;align-items:center;gap:8px}.sp{justify-content:space-between}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal .h{font-size:12px;color:var(--mu)}
.d{aspect-ratio:1;border-radius:8px;border:1px solid transparent;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;color:var(--tx);padding:0}
.d.sel{border-color:var(--ac);background:var(--ac2)}.d.oggi{font-weight:700;color:var(--pr)}
.dots{display:flex;gap:2px;height:6px}.dot{width:6px;height:6px;border-radius:50%;background:var(--ok)}.dot.p{background:var(--pr)}
.chip{display:inline-block;padding:8px 12px;margin:3px 3px 3px 0;border:1px solid var(--bd);border-radius:20px;background:var(--card);color:var(--tx);font-size:14px}
.chip.on{background:var(--ac);border-color:var(--ac);color:var(--onac)}
.tag{font-size:12px;padding:2px 8px;border-radius:10px;background:var(--ac2);color:var(--ac)}.tag.p{background:var(--prbg);color:var(--pr)}
.mu{color:var(--mu);font-size:14px}
button.pri{background:var(--ac);color:var(--onac);border:0;border-radius:10px;padding:12px 16px;font-size:16px}
button.sec{background:transparent;color:var(--ac);border:1px solid var(--bd);border-radius:10px;padding:10px 14px;font-size:15px}
button.dg{color:var(--dg)}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));border-radius:28px;padding:15px 20px;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:6}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit}
label.l{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:10;overflow-y:auto;padding:calc(10px + env(safe-area-inset-top,0px)) 14px calc(30px + env(safe-area-inset-bottom,0px))}
.pres{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--bd)}
.pres input{width:24px;height:24px;flex:none}
.hide{display:none}
#auth{z-index:20}
.tbl{overflow-x:auto}table{border-collapse:collapse;font-size:13px;width:100%}td,th{border:1px solid var(--bd);padding:4px 6px;text-align:left;white-space:nowrap}
.rs{display:grid;grid-template-columns:minmax(0,1fr) repeat(4,46px);align-items:center;gap:2px;border-bottom:1px solid var(--bd);padding:3px 0}
.rs .nm{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sq{width:32px;height:32px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--onac);padding:0;font-size:16px;justify-self:center}
.sq.on{background:var(--ac);border-color:var(--ac)}

/* ---- look app / 3D ---- */
:root{--ach:#2a8a5a;--acl:#175235;--sh:rgba(16,40,28,.16)}
@media not all{:root:not([data-theme="light"]){--ach:#86d6a5;--acl:#3f9a63;--sh:rgba(0,0,0,.6)}}
:root[data-theme="dark"]{--ach:#86d6a5;--acl:#3f9a63;--sh:rgba(0,0,0,.6)}
*{-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;accent-color:var(--ac)}
button{font-family:inherit;cursor:pointer;transition:transform .08s ease,box-shadow .08s ease}
header{background:linear-gradient(135deg,#0a0d0b 0%,#10241a 100%);border-bottom:0;border-radius:0 0 22px 22px;box-shadow:0 6px 18px var(--sh);padding:16px 18px 18px}
h1{font-size:21px;letter-spacing:.01em}
nav{padding:12px 12px 8px}
nav button{border:1px solid var(--bd);border-radius:14px;padding:11px 6px;font-weight:600;background:linear-gradient(180deg,var(--card),var(--ac2));box-shadow:0 3px 0 var(--bd),0 5px 10px var(--sh)}
nav button.on{background:linear-gradient(180deg,var(--ach),var(--acl));border-color:var(--acl);color:#fff;box-shadow:0 3px 0 var(--acl),0 5px 12px var(--sh)}
:root[data-theme="dark"] nav button.on{color:#06140c}
@media not all{:root:not([data-theme="light"]) nav button.on,:root:not([data-theme="light"]) .chip.on,:root:not([data-theme="light"]) button.pri,:root:not([data-theme="light"]) .sq.on{color:#06140c}}
nav button:active,.chip:active,button.sec:active,.sq:active{transform:translateY(2px)}
.card{border-radius:16px;box-shadow:0 1px 2px var(--sh),0 8px 20px var(--sh);border-color:transparent}
.card[data-e]{cursor:pointer}.card[data-e]:active{transform:scale(.985)}
.chip{padding:9px 14px;margin:4px 5px 5px 0;border-radius:22px;font-weight:500;background:linear-gradient(180deg,var(--card),var(--ac2));box-shadow:0 3px 0 var(--bd),0 4px 8px var(--sh)}
.chip.on{background:linear-gradient(180deg,var(--ach),var(--acl));border-color:var(--acl);color:#fff;box-shadow:0 3px 0 var(--acl),0 4px 10px var(--sh);font-weight:600}
.chip:active{box-shadow:0 1px 0 var(--bd)}
button.pri{background:linear-gradient(180deg,var(--ach),var(--acl));border-radius:14px;font-weight:700;color:#fff;box-shadow:0 4px 0 var(--acl),0 8px 16px var(--sh);letter-spacing:.01em}
button.pri:active{transform:translateY(3px);box-shadow:0 1px 0 var(--acl)}
:root[data-theme="dark"] button.pri,:root[data-theme="dark"] .chip.on,:root[data-theme="dark"] .sq.on{color:#06140c}
button.sec{border-radius:12px;background:linear-gradient(180deg,var(--card),var(--ac2));box-shadow:0 2px 0 var(--bd),0 3px 8px var(--sh);font-weight:600}
button.sec:active{box-shadow:0 0 0 var(--bd)}
button.dg{color:var(--dg)}
.fab{background:linear-gradient(180deg,var(--ach),var(--acl));border-radius:30px;padding:16px 22px;font-weight:700;box-shadow:0 5px 0 var(--acl),0 12px 24px var(--sh)}
.fab:active{transform:translateY(4px);box-shadow:0 1px 0 var(--acl)}
.d{border-radius:12px;box-shadow:0 2px 0 var(--bd),0 3px 6px var(--sh)}
.d.sel{background:linear-gradient(180deg,var(--ac2),var(--card));border-color:var(--ac);box-shadow:0 2px 0 var(--ac),0 3px 8px var(--sh)}
.d.oggi{box-shadow:inset 0 0 0 2px var(--pr),0 2px 0 var(--bd)}
.d:active{transform:translateY(2px)}
.tag{border-radius:12px;padding:3px 10px;font-weight:600}
input,select,textarea{border-radius:12px;box-shadow:inset 0 2px 4px var(--sh)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px var(--ac2)}
.pres{border-radius:10px}
.sq{border-radius:10px;width:34px;height:34px;background:linear-gradient(180deg,var(--card),var(--ac2));box-shadow:0 2px 0 var(--bd),0 3px 6px var(--sh)}
.sq.on{background:linear-gradient(180deg,var(--ach),var(--acl));border-color:var(--acl);color:#fff;box-shadow:0 2px 0 var(--acl)}
details>summary{cursor:pointer;list-style:none}details>summary::before{content:"▸ ";color:var(--ac)}details[open]>summary::before{content:"▾ "}
.sheet{background:linear-gradient(180deg,var(--bg),var(--bg))}
.lg{display:flex;align-items:center;gap:6px;font-size:13px;padding:2px 0}.lg i{width:11px;height:11px;border-radius:3px;flex:none}.lg span:first-of-type{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header{display:flex;align-items:center;gap:14px}
.logo{height:74px;width:auto;flex:none}
.skull{height:58px;width:auto;margin-left:auto;flex:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
nav button{font-size:12px;line-height:1.15;padding:7px 2px;font-weight:600}
.crr{display:grid;grid-template-columns:26px minmax(0,1fr) repeat(4,50px);gap:4px;align-items:center;padding:4px 0;border-bottom:1px solid var(--bd)}
.crr .nm{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crr input[type=text]{padding:8px 2px;text-align:center;font-size:14px;border-radius:8px;width:50px}
.crr input[type=text]:disabled{opacity:.35}
.crr input[type=checkbox]{width:22px;height:22px;box-shadow:none}
.crk{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--bd)}
.crk .nm{font-size:14px}

:root[data-theme="dark"]{--bg:#0a0d0b;--card:#141a16;--tx:#e8eee8;--mu:#9bab9f;--ac:#6fc48f;--onac:#0a0d0b;--ac2:#1d2b22;--ok:#6fc48f;--bd:#26322a;--prbg:#3a2412;--ach:#86d6a5;--acl:#3f9a63;--sh:rgba(0,0,0,.6)}
:root[data-theme="light"]{--bg:#ffffff;--card:#f4f7f4;--tx:#111a14;--mu:#5f6f64;--ac:#1e6b43;--onac:#fff;--ac2:#e4eee1;--ok:#2f8f5b;--bd:#dfe6df;--prbg:#fde8d6;--ach:#2a8a5a;--acl:#175235;--sh:rgba(16,40,28,.12)}
:root[data-theme="green"]{--bg:#b9cbb0;--card:#e0eada;--tx:#10241a;--mu:#445a4b;--ac:#1c5a38;--onac:#fff;--ac2:#c7d8bf;--ok:#1f7a49;--bd:#a7bd9d;--prbg:#fbe3cc;--ach:#2a8a5a;--acl:#134a2c;--sh:rgba(16,40,28,.25)}
body{transition:background .25s ease,color .25s ease}
.skull{cursor:pointer;transition:transform .15s ease}.skull:active{transform:scale(.9) rotate(-8deg)}
</style>
</head>

var QUOTES=[["Non si tratta di non cadere mai, ma di quanto velocemente ti rialzi quando succede.","Michael Jordan"],["Il talento ti fa vincere una partita, ma il lavoro di squadra e l'intelligenza ti fanno vincere un campionato.","Michael Jordan"],["L'allenamento non finisce quando sei stanco, finisce quando hai finito.","Tim Grover"],["La mente cede sempre prima del corpo. Se impari a governare i tuoi pensieri, scoprirai di poter andare molto più lontano di quanto credessi.","Julio Velasco"],["Non concentrarti sul risultato finale; concentrati sull'esecuzione del prossimo singolo movimento.","Nick Saban"],["L'eccellenza non è un atto isolato, ma un'abitudine. Noi siamo ciò che facciamo ripetutamente.","Coach John Wooden"],["Hai due scelte: o domini la tua giornata, o la giornata dominerà te.","Kobe Bryant"],["Il successo non è mai definitivo, il fallimento non è mai fatale: è il coraggio di continuare che conta.","Coach Vince Lombardi"],["Se vuoi ottenere qualcosa che non hai mai avuto, devi essere disposto a fare qualcosa che non hai mai fatto.","Gari Kasparov"],["Non sono quello che mi è successo, sono quello che ho scelto di diventare.","Carl Gustav Jung"],["Rendi conscio l'inconscio, altrimenti sarà l'inconscio a guidare la tua vita e tu lo chiamerai destino.","Carl Gustav Jung"],["La tua visione diventerà chiara solo quando guarderai nel tuo cuore. Chi guarda all'esterno sogna; chi guarda all'interno si sveglia.","Carl Gustav Jung"],["Non possiamo cambiare nulla finché non lo accettiamo. La condanna non libera, opprime.","Carl Gustav Jung"],["La cosa più terrificante è accettare se stessi completamente.","Carl Gustav Jung"],["In ogni caos c'è un cosmo, in ogni disordine un ordine segreto.","Carl Gustav Jung"],["Non abbiamo poco tempo, ma ne perdiamo molto. La vita è abbastanza lunga se sai come usarla.","Seneca"],["Hai potere sulla tua mente, non sugli eventi esterni. Realizza questo e troverai la tua forza.","Marco Aurelio"],["Sii il cambiamento che vuoi vedere nel mondo.","Tradizione Stoica e Filosofica"],["Scegli il lavoro che ami e non lavorerai neppure un giorno in tutta la tua vita.","Confucio"],["Il lavoro non è solo un modo per guadagnarsi da vivere, è il terreno in cui esprimiamo chi siamo veramente.","Carl Gustav Jung"],["La grandezza di un lavoro non si misura dall'importanza che gli altri gli attribuiscono, ma dall'amore e dalla cura che ci metti nel farlo.","Martin Luther King Jr."],["Il segreto del successo, della felicità e della realizzazione sta nel trovare qualcosa che ami fare e nell'offrirlo agli altri.","Filosofia Ikigai"],["Fai ciò che puoi, con quello che hai, nel posto in cui ti trovi.","Theodore Roosevelt"],["La passione è l'energia che ti spinge ad alzarti la mattina con la voglia di costruire qualcosa che prima non c'era.","Oprah Winfrey"],["Quando trasformi la tua passione nel tuo mestiere, ogni fatica diventa parte della bellezza del percorso.","Pensiero di Pedagogia del Lavoro"],["Il campo da gioco è uno specchio della vita: ti mostra chi sei quando le cose vanno bene, ma soprattutto quando vanno male.","Julio Velasco"],["Non si vince quando si taglia il traguardo, si vince nei mesi e negli anni di preparazione in cui nessuno ti guarda.","Emil Zátopek"],["La vittoria è bellissima, ma la vera magia dello sport risiede nella trasformazione interiore di chi si è allenato per raggiungerla.","Ayrton Senna"],["Lo sport non costruisce il carattere, lo rivela.","Heywood Broun"],["La montagna, il campo, la pista non mentono mai. Ti restituiscono esattamente quello che le hai dato.","Walter Bonatti"],["Nella disciplina sportiva c'è una poesia silenziosa: quella di superare se stessi senza dover dimostrare nulla agli altri.","Roger Federer"],["Il valore dello sport non sta nel trofeo che porti a casa, ma nella persona che diventi durante il viaggio.","Coach John Wooden"],["Un buon allenatore ti fa vedere quello che puoi diventare, non solo quello che sei.","Coach John Wooden"],["L'allenatore mediocre racconta. Il buon allenatore spiega. L'allenatore dimostra. Il grande allenatore ispira.","William Arthur Ward"],["Non alleniamo atleti per vincere una gara la domenica; alleniamo persone affinché imparino ad affrontare la vita.","Julio Velasco"],["Allenare significa entrare nella vita di qualcuno e lasciarvi un'impronta che non si cancellerà mai.","Coach Vince Lombardi"],["La fiducia che un allenatore ripone in un atleta spesso diventa la scintilla con cui l'atleta impara a credere in se stesso.","Nick Saban"],["I campioni non si creano nelle palestre. I campioni si creano da qualcosa che hanno profondo dentro di loro: un desiderio, un sogno, una visione.","Muhammad Ali"],["La misura del tuo valore come coach non si conta con le medaglie appese al muro, ma con il rispetto e i ricordi che lasci nei tuoi ragazzi.","Dan Gable"],["Guidare gli altri richiede due cose fondamentali: una grande fermezza nei principi e un'infinita empatia per le persone.","Carlo Ancelotti"],["Un maestro non è chi insegna qualcosa, ma chi ispira l'alunno a dare il meglio di sé per scoprire ciò che già conosce.","Paulo Coelho"],["Insegna ai ragazzi come pensare, non cosa pensare. Dagli strumenti per scalare la montagna, non spingerli su per il sentiero.","Margaret Mead"],["Il coraggio non è la mancanza di paura, ma la consapevolezza che c'è qualcosa di più importante della paura.","Ambrose Redmoon"],["Ciò che facciamo per noi stessi muore con noi. Ciò che facciamo per gli altri e per il mondo rimane ed è immortale.","Albert Pike"],["La preparazione è tutto. Quando il momento della prestazione arriva, il tempo per prepararsi è già passato.","Coach John Wooden"],["La mente è come un paracadute: funziona solo se si apre.","Albert Einstein"],["La misura di ciò che siamo è quello che facciamo con ciò che abbiamo.","Coach Vince Lombardi"],["Non puoi attraversare il mare semplicemente stando fermo a guardare l'acqua.","Rabindranath Tagore"],["L'insegnamento non è riempire un vaso, ma accendere un fu
